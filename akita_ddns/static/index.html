<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akita DDNS Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1000px;
        }
        h1 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 40px;
            color: #fff;
        }
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }
        .glass-panel:hover {
            transform: translateY(-2px);
        }
        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--accent);
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 12px;
            font-weight: 500;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        th {
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        tbody tr {
            transition: background 0.2s;
        }
        tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        .timestamp {
            font-family: monospace;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        @media (max-width: 768px) {
            .split-view {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AKITA DDNS</h1>
    
    <div class="glass-panel">
        <h2>Active Registry</h2>
        <table>
            <thead>
                <tr>
                    <th>Namespace</th>
                    <th>Name</th>
                    <th>RID (Destination)</th>
                    <th>Expires In</th>
                </tr>
            </thead>
            <tbody id="registry-body">
                <tr><td colspan="4" style="text-align:center; color: var(--text-muted);">Loading data...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="split-view" style="display: flex; gap: 24px;">
        <div class="glass-panel" style="flex: 1;">
            <h2>Namespaces</h2>
            <table>
                <thead>
                    <tr>
                        <th>Namespace</th>
                        <th>Owner Identity</th>
                    </tr>
                </thead>
                <tbody id="namespaces-body">
                    <tr><td colspan="2" style="text-align:center; color: var(--text-muted);">Loading data...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="glass-panel" style="flex: 1;">
            <h2>Node Reputation</h2>
            <table>
                <thead>
                    <tr>
                        <th>Identity Hash</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="reputation-body">
                    <tr><td colspan="2" style="text-align:center; color: var(--text-muted);">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function clearAndMessage(body, columns, message) {
        body.replaceChildren();
        const row = body.insertRow();
        const cell = row.insertCell();
        cell.colSpan = columns;
        cell.style.textAlign = 'center';
        cell.style.color = 'var(--text-muted)';
        cell.textContent = message;
    }

    function addCell(row, value, className) {
        const cell = row.insertCell();
        if (className) cell.className = className;
        cell.textContent = String(value);
        return cell;
    }

    async function fetchData() {
        try {
            const [regRes, nsRes, repRes] = await Promise.all([
                fetch('/api/registry').catch(() => null),
                fetch('/api/namespaces').catch(() => null),
                fetch('/api/reputation').catch(() => null)
            ]);
            
            if (regRes && regRes.ok) {
                const regData = await regRes.json();
                const regBody = document.getElementById('registry-body');
                if (regData.length === 0) {
                    clearAndMessage(regBody, 4, 'No active entries');
                } else {
                    regBody.replaceChildren();
                    const now = Date.now() / 1000;
                    regData.forEach(entry => {
                        const expires = Math.max(0, Math.round(entry.expiration - now));
                        const row = regBody.insertRow();
                        addCell(row, entry.namespace, 'badge');
                        addCell(row, entry.name);
                        addCell(row, entry.rid, 'timestamp');
                        addCell(row, `${expires}s`);
                    });
                }
            }

            if (nsRes && nsRes.ok) {
                const nsData = await nsRes.json();
                const nsBody = document.getElementById('namespaces-body');
                const nsKeys = Object.keys(nsData);
                if (nsKeys.length === 0) {
                    clearAndMessage(nsBody, 2, 'No namespaces');
                } else {
                    nsBody.replaceChildren();
                    nsKeys.forEach(ns => {
                        const row = nsBody.insertRow();
                        addCell(row, ns, 'badge');
                        addCell(row, nsData[ns], 'timestamp');
                    });
                }
            }

            if (repRes && repRes.ok) {
                const repData = await repRes.json();
                const repBody = document.getElementById('reputation-body');
                const repKeys = Object.keys(repData);
                if (repKeys.length === 0) {
                    clearAndMessage(repBody, 2, 'No reputation data');
                } else {
                    repBody.replaceChildren();
                    repKeys.sort((a,b) => repData[b] - repData[a]).forEach(hash => {
                        const row = repBody.insertRow();
                        addCell(row, hash, 'timestamp');
                        addCell(row, repData[hash], 'badge');
                    });
                }
            }
        } catch (err) {
            console.error('Error fetching data:', err);
        }
    }

    fetchData();
    setInterval(fetchData, 5000);
</script>

</body>
</html>
