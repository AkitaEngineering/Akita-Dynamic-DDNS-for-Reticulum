[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akita-ddns"
version = "1.0.0"
description = "Signed distributed destination naming for Reticulum networks"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{name = "Akita Engineering"}]
dependencies = [
    "rns>=1.1,<2",
    "PyYAML>=6,<7",
    "aiohttp>=3.10,<4",
    "msgpack>=1,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "mypy>=1.10,<2",
]

[project.scripts]
akita-ddns = "akita_ddns.main:main"

[tool.setuptools.packages.find]
include = ["akita_ddns*"]

[tool.setuptools.package-data]
akita_ddns = ["static/*.html"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
disable_error_code = ["import-untyped"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
